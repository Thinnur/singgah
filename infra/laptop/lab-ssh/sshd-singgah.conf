# Singgah: password satu-satunya cara masuk (dicabut/diganti di portal = langsung berlaku); tanpa root, tanpa forwarding.
HostKey /etc/ssh/hostkeys/ssh_host_ed25519_key
PasswordAuthentication yes
KbdInteractiveAuthentication no
AuthorizedKeysFile none
PermitRootLogin no
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no
MaxAuthTries 3
LoginGraceTime 30
