# Singgah: laptop gateway tidak boleh tidur (PRD 9.1), juga saat lid ditutup.
# Dipasang deploy.sh ke /etc/systemd/logind.conf.d/. Berlaku setelah reboot berikutnya:
# JANGAN restart systemd-logind (bisa mematikan sesi desktop pemilik laptop).
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
