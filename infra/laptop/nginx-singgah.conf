# Singgah: nginx sebagai reverse proxy portal. Dipasang deploy.sh ke /etc/nginx/sites-available/singgah.
# Alur: browser -> Cloudflare -> cloudflared (VPS) -> Tailscale -> nginx :8080 -> singgah-api 127.0.0.1:8780
# Bukan port 80/443: keduanya dibelokkan iptables ke Traefik bawaan k3s (svclb) sebelum sampai ke nginx.
server {
	listen 8080;
	server_name singgah.akzara.id;

	# API mempercayai header CF-Connecting-IP dari nginx (TRUSTED_PROXY_IP=127.0.0.1),
	# jadi hanya relay VPS (cloudflared) dan localhost yang boleh lewat sini
	allow 100.68.122.86;
	allow 127.0.0.1;
	deny all;

	# koneksi ke API kini selalu dari 127.0.0.1, jadi batas loopback test-login tidak berlaku lagi: tutup di sini
	location ^~ /auth/test-login { return 404; }

	location / {
		proxy_pass http://127.0.0.1:8780;
		proxy_set_header Host $host;
	}
}
